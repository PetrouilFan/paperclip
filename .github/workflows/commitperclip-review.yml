name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Manual re-gate. `pull_request_target` only fires on a push to the head
  # branch, so it cannot notice three things, all of which leave an open PR
  # carrying a verdict that describes nothing:
  #
  #   1. A dropped `opened`/`synchronize` event. A PR whose first event was
  #      never dispatched stays ungated forever, and GitHub still reports it
  #      `mergeStateStatus: CLEAN`.
  #   2. A change to the gates themselves. When this workflow's own logic
  #      changes on master, every open PR keeps the verdict its last push
  #      produced, which was computed by the *previous* version of the gates.
  #   3. A dropped `synchronize` event on a later push, leaving the head
  #      commit's `review` check describing an earlier revision.
  #
  # This trigger closes all three: run it against an open PR to get the
  # current verdict from the current gate code.
  #
  # ## Which signal a reviewer should read
  #
  # A manual run cannot write a verdict onto the pull request head, and this
  # is a platform limit rather than a bug to work around. A `workflow_dispatch`
  # run's own check attaches to the ref it was dispatched on (`master`), not
  # to the PR head. To move the PR head's `review` check the workflow would
  # have to mutate a check run it does not own, which GitHub removed on
  # 2025-03-31: "developers will soon lose the ability to modify the
  # conclusion and status of an Actions-created check run using the GitHub
  # token from a workflow run"
  # (https://github.blog/changelog/2025-02-12-notice-of-upcoming-deprecations-and-breaking-changes-for-github-actions/#changes-to-check-run-status-modification).
  # Any such call now answers `HTTP 403`.
  #
  # So the `review` check on an open PR head is *always* whatever its last
  # push produced. A re-gate never moves it, and a re-gate cannot make an
  # open PR mergeable. Read the re-gate verdict from these instead, in order:
  #
  #   1. The run itself. A re-gate that passes is a green run; a re-gate that
  #      fails is a red one. `Fail if quality gates failed` is what decides
  #      that, and it runs on every trigger.
  #   2. The `commitperclip` comment on the PR. It carries the per-gate detail
  #      and is stamped with the run and the gate revision that produced it, so
  #      a fresh verdict is distinguishable from a stale one.
  #   3. The `commitperclip/quality-gates` commit status on the head SHA. This
  #      is the one machine-readable verdict that still lands on the head
  #      commit, and its link points back at the run.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open pull request number to (re-)run the quality gates against'
        required: true
        type: string

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.
# workflow_dispatch carries the same secret access, and resolves the PR over
# the API rather than from the event, so it also never checks out PR code.

permissions:
  pull-requests: write
  # `checks: write` is still needed by `actions/dependency-review-action`,
  # which calls the check-runs API itself. This workflow's own steps do not
  # write check runs: see the `workflow_dispatch` comment above.
  checks: write
  # The manual re-gate records its verdict as a commit status, which is the
  # one head-commit signal a workflow token is still allowed to write.
  statuses: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Single source of PR context for both triggers. `pull_request_target`
      # carries the pull request in the event payload; `workflow_dispatch`
      # carries only the number, so it is resolved over the API. Every later
      # step reads this step's outputs rather than `github.event.pull_request.*`,
      # which is empty on a dispatch and would silently blank the base/head
      # refs and the PR number.
      #
      # This runs *before* the checkout because the checkout needs it. That
      # ordering is the whole point of the fix below, and the two must not be
      # swapped back.
      - name: Resolve pull request context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          pr_number="${REQUESTED_PR:-}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]] || [ "$pr_number" -le 0 ]; then
            echo "::error::pr_number must be a positive integer, got '${pr_number:-<empty>}'"
            exit 1
          fi

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          state="$(printf '%s' "$pr" | jq -r '.state')"
          if [ "$state" != "open" ]; then
            echo "::error::PR #${pr_number} is '${state}'. The quality gates describe an open pull request; re-run against an open PR."
            exit 1
          fi

          # `base.sha` is the merge base the event was raised against, and it is
          # the only value here that is a commit rather than a mutable name.
          # A branch name would let a push to the base change which gate code
          # this run executes between the moment it starts and the moment the
          # verdict is published.
          {
            echo "number=${pr_number}"
            printf '%s' "$pr" | jq -r '"author=\(.user.login)"'
            printf '%s' "$pr" | jq -r '"head_ref=\(.head.ref)"'
            printf '%s' "$pr" | jq -r '"head_sha=\(.head.sha)"'
            printf '%s' "$pr" | jq -r '"base_sha=\(.base.sha)"'
          } >> "$GITHUB_OUTPUT"

      # Still never PR code: this is the base *commit*, resolved over the API
      # and read out of this run's own outputs, not a ref that PR code can
      # influence.
      #
      # It used to be a hardcoded `ref: master` under this same name. That made
      # the gates' verdict a function of master's copy of the gates and nothing
      # else, which is a real defect with two faces:
      #
      #   1. A pull request that *adds or changes* a gate is judged by the
      #      version of that gate already on master. A brand-new gate cannot
      #      run on the pull request that introduces it, so its first exercise
      #      is on the pull request after it — and until it merges, never.
      #   2. For a pull request against a base other than master, the gates ran
      #      code that was not the base's code at all.
      #
      # The `workflow_dispatch` trigger below exists to re-gate a pull request
      # whose verdict describes nothing. Checking out `master` reintroduced the
      # same staleness one level down, where the re-gate could not fix it.
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.base_sha }}

      # Left gating on purpose. This step is a real security gate, and this
      # repository carries open Dependabot alerts that it is the thing meant to
      # catch, so it must not be demoted to advisory by a CI change.
      #
      # It is also *intermittently* unreliable here: `GET /dependency-graph/sbom`
      # returns a real SPDX document on this fork, but the action has failed
      # without analysing anything on roughly one push in twelve (run
      # 36225657885). That intermittency is a separate defect, tracked on its
      # own; it is not a reason to weaken the gate, and fixing it does not
      # require this change.
      #
      # Making the quality gates reachable is done below instead, at the token
      # step, which was the unconditional hard failure that skipped every
      # later step on any repository without the commitperclip App installed,
      # and at the `workflow_dispatch` trigger above, which re-runs them on
      # demand for a PR that no longer carries a trustworthy verdict.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.pr.outputs.base_sha }}
          head-ref: ${{ steps.pr.outputs.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Generate commitperclip token
        id: token
        run: |
          set -euo pipefail
          if [ -n "${COMMITPERCLIP_KEY:-}" ]; then
            TOKEN="$(node .github/scripts/get-bot-token.mjs)"
            COMMENTER='commitperclip[bot]'
          else
            # The commitperclip app is not installed on every repository that
            # runs this workflow (a fork has no app installation and therefore
            # no COMMITPERCLIP_KEY). Hard-failing here used to skip every
            # later step, so the quality gates below never ran at all. The
            # gates only need to read the PR and write one issue comment, and
            # this job already declares exactly that in `permissions`.
            TOKEN="${GITHUB_TOKEN}"
            COMMENTER='github-actions[bot]'
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
          echo "commenter=$COMMENTER" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run quality gates
        id: quality
        if: steps.pr.outputs.author != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_COMMENTER_LOGIN: ${{ steps.token.outputs.commenter }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_BRANCH: ${{ steps.pr.outputs.head_ref }}
          # Stamped into the commitperclip comment so a reviewer can tell a
          # verdict this run just produced from one left by an earlier push,
          # and which revision of the gates produced it. `GATE_BASE_SHA` is
          # the commit the gates were read from, which is the ref this job
          # checks out rather than the PR head.
          GATE_RUN_ID: ${{ github.run_id }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_BASE_SHA: ${{ github.sha }}

      - name: Fail if quality gates failed
        if: >-
          steps.pr.outputs.author != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1

      # A `workflow_dispatch` run's own check attaches to the ref it was
      # dispatched on, not to the pull request head, so the PR's `review` check
      # is left holding whatever its last push produced — which on a manual
      # re-gate is precisely the stale verdict this trigger exists to replace.
      # This step used to try to move that check, and could not: GitHub removed
      # workflow-token mutation of an Actions-created check run on 2025-03-31,
      # so the call answered `HTTP 403` on every manual run and turned every
      # re-gate red. A red run cannot be a re-gate remedy, and it is also
      # unreadable: a reviewer cannot tell a broken publisher from a broken
      # pull request. See the `workflow_dispatch` comment above for the full
      # reasoning and the signals to read instead.
      #
      # What this step writes is a commit status on the head SHA under the
      # `commitperclip/quality-gates` context. That is the one head-commit
      # signal a workflow token is still allowed to write, and it is named so it
      # cannot be mistaken for the `review` check. `target_url` sends a
      # reviewer straight to this run, which is what makes the status usable as
      # a pointer rather than just a colour.
      #
      # `always()` is load-bearing: the step above exits 1 on a gate failure,
      # which fails the job, and without it this step would be skipped in
      # precisely the case that matters most — recording the `failure` verdict.
      #
      # `steps.quality.outcome` is deliberately NOT part of this condition.
      # `Run quality gates` carries an `if:` with no status function, so
      # GitHub evaluates it as `success() && …`, which means any failure
      # earlier in the job leaves `steps.quality.outcome` at `skipped`. Guarding
      # on it therefore skipped this step on the three pre-gate failure paths —
      # `Dependency Review`, `Set up Node`, and `Generate commitperclip token`
      # — so a re-gate whose run died early wrote no verdict at all and the
      # pull request kept the superseded one. That is the exact defect the
      # `workflow_dispatch` trigger exists to remove, reintroduced inside the
      # step that removes it. The three outcomes are told apart in the shell
      # below instead, where the "did not reach the gates" case records a
      # `failure` verdict rather than staying silent.
      #
      # `head_sha` is the only guard here that has to be able to skip, and it
      # cannot be the one that swallows a verdict: it is written by the resolve
      # step, which runs before all three of those. It is empty only when the
      # run died at or before the resolve step, and then there is no head SHA to
      # record a verdict against.
      - name: Record the re-gate verdict on the pull request head (manual runs only)
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          steps.pr.outputs.author != 'dependabot[bot]' &&
          steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          GATE_OUTCOME: ${{ steps.quality.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Every outcome other than a completed pass is a `failure` verdict.
          # `skipped` and `cancelled` both mean the gates produced no verdict,
          # so the head commit is unproven — and unproven must not render as
          # green, or the status is lying in the same way this step's guard
          # did. The comment the gate script would have written does not exist
          # on those paths either, so the summary must not point a reviewer at
          # it.
          case "$GATE_OUTCOME" in
            success)
              state=success
              detail="Quality gates passed"
              note="The per-gate detail is in the commitperclip comment on this pull request."
              ;;
            failure)
              state=failure
              detail="Quality gates failed"
              note="The per-gate detail is in the commitperclip comment on this pull request."
              ;;
            *)
              state=failure
              detail="Run did not reach the quality gates"
              note="This run failed before the quality gates produced a verdict, so this head commit is unproven. Read the run log for the failing step, then re-gate."
              ;;
          esac

          # A commit status `description` is capped at 140 characters, so this
          # stays a headline that links through to the run rather than
          # restating the gate detail the comment already holds.
          description="${detail} — manual re-gate"
          if [ "${#description}" -gt 140 ]; then
            description="$detail"
          fi

          {
            echo "### commitperclip quality gates — ${detail}"
            echo
            echo "- Pull request: #${PR_NUMBER} (head \`${HEAD_SHA}\`)"
            echo "- Run: ${RUN_URL}"
            if [ "$GATE_OUTCOME" = success ] || [ "$GATE_OUTCOME" = failure ]; then
              echo "- Per-gate detail: the \`commitperclip\` comment on this pull request."
            else
              echo "- Per-gate detail: none. ${note}"
            fi
            echo
            echo "The \`review\` check on this head commit is **not** this verdict."
            echo "It is whatever the last push produced, and a workflow can no longer"
            echo "change it. A manual re-gate never turns a pull request green; read the"
            echo "signals above."
          } >> "$GITHUB_STEP_SUMMARY"

          # Recording the verdict must not decide the run. `Fail if quality
          # gates failed` already exits 1 on a genuine gate failure, and a run
          # that died before the gates is already red from the step that died.
          # Failing here as well would report the same verdict a second time,
          # and would make any future write failure look like a broken pull
          # request — the exact confusion this step used to cause with its 403.
          # On the paths where the gate script did run, the run conclusion and
          # the commitperclip comment already carry the verdict twice over.
          if ! printf '%s' "$(jq -n \
              --arg state "$state" \
              --arg description "$description" \
              --arg target_url "$RUN_URL" \
              '{state: $state, description: $description, target_url: $target_url}')" \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" --input - > /dev/null; then
            echo "::warning::Could not record the commitperclip/quality-gates status on ${HEAD_SHA}."
            echo "::warning::The run conclusion above is still the gate verdict, and the commitperclip comment on the pull request still carries the per-gate detail."
          fi

