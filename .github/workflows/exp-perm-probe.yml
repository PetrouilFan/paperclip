name: exp perm probe (throwaway)

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe every call the quality gates make
        run: |
          set +e
          probe() {
            method="$1"; ep="$2"; data="$3"
            if [ -n "$data" ]; then
              code=$(curl -sS -o /tmp/pb -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GH" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                --data "$data" "https://api.github.com/$ep")
            else
              code=$(curl -sS -o /tmp/pb -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GH" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/$ep")
            fi
            echo "PROBE $method $ep -> $code"
            if [ "$code" -ge 400 ]; then
              echo "PROBE_BODY $method $ep -> $(head -c 300 /tmp/pb)"
            fi
          }

          echo "PROBE token_actor=$(curl -sS -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" https://api.github.com/user | head -c 120)"

          probe GET "repos/$GITHUB_REPOSITORY"
          probe GET "repos/$GITHUB_REPOSITORY/pulls/$PR"
          probe GET "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100&page=1"
          probe GET "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100&page=1"
          probe GET "repos/$GITHUB_REPOSITORY/contents/package.json?ref=master"
          probe GET "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100&page=1"

          body='{"body":"exp perm probe - will be deleted"}'
          probe POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" "$body"
          new_id=$(node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync("/tmp/pb","utf8"));process.stdout.write(String(j.id??""))}catch(e){process.stdout.write("")}')
          echo "PROBE created_comment_id=$new_id"
          if [ -n "$new_id" ]; then
            probe PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$new_id" '{"body":"exp perm probe - edited"}'
            probe DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$new_id"
          fi
        env:
          GH: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
