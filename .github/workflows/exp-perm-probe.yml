name: exp perm probe (throwaway)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe comment identity and re-find behaviour
        run: |
          set +e
          sig='— commitperclip'
          api() {
            curl -sS -H "Authorization: Bearer $GH" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          echo "PROBE run=${GITHUB_RUN_NUMBER} attempt=${GITHUB_RUN_ATTEMPT}"

          # What the gates see today: every comment author, and which signed ones
          # the owner filter would match.
          api "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100&page=1" > /tmp/c.json
          node -e '
            const fs=require("fs");
            const cs=JSON.parse(fs.readFileSync("/tmp/c.json","utf8"));
            const sig="— commitperclip";
            console.log("PROBE comment_count="+cs.length);
            for (const c of cs) {
              const login=c.user?.login;
              const signed=typeof c.body==="string"&&c.body.includes(sig);
              const owners=new Set(["commitperclip[bot]","commitperclip","github-actions[bot]"]);
              console.log(`PROBE comment id=${c.id} login=${login} signed=${signed} ownerMatch=${owners.has(login)} adopted=${signed&&owners.has(login)}`);
            }
          '

          # Create the gate comment the way upsertComment would.
          api -X POST -H "Content-Type: application/json" \
            --data "{\"body\":\"probe output\\n\\n${sig}\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments" > /tmp/p.json
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("/tmp/p.json","utf8"));
            console.log("PROBE created id="+j.id+" author_login="+j.user?.login+" author_type="+j.user?.type);
          '
        env:
          GH: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
